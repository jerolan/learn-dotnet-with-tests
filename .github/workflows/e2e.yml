name: e2e

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  RUN_E2E: "1"

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa/e2e-playwright
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.55.0-chromium
      - name: Build
        run: dotnet build E2E.sln
      - name: Install Chromium
        run: pwsh tests/TaskBoard.Tests/bin/Debug/net6.0/playwright.ps1 install --with-deps chromium
      - name: Run the browser test
        run: dotnet test E2E.sln --no-build --nologo
